# Use together with docker-compose.yml on a Google Compute Engine VM.
# PUBLIC_HOST must be a DNS name resolving to the VM's public IP.
services:
  caddy:
    image: caddy:2-alpine
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
